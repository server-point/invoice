<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoicing App</title>

  <style>
    :root {
      --primary: #4f46e5;
      --accent: #06b6d4;
      --bg-dark: #0b1120;
      --bg-mid: #111c35;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }

    /* ---------- IFRAME ---------- */
    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 1;
    }
    .app-frame.is-visible { opacity: 1; }

    /* ---------- PRE-LOADER ---------- */
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background:
        radial-gradient(circle at 20% 20%, rgba(79, 70, 229, 0.25), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.20), transparent 45%),
        linear-gradient(160deg, var(--bg-dark), var(--bg-mid));
      color: var(--text);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Logo / spinner */
    .loader-ring {
      position: relative;
      width: 84px;
      height: 84px;
    }
    .loader-ring::before,
    .loader-ring::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }
    .loader-ring::before {
      border: 3px solid rgba(255, 255, 255, 0.08);
    }
    .loader-ring::after {
      border: 3px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--primary);
      animation: spin 1.1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }
    .loader-ring__core {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 0 24px rgba(79, 70, 229, 0.55);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
      text-align: center;
    }

    /* Progress bar */
    .progress {
      width: min(320px, 80vw);
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .progress__bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
    }
    .progress__value {
      margin-top: -16px;
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Error state */
    .error-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 24px 28px;
      max-width: 380px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 14px;
      backdrop-filter: blur(6px);
    }
    .error-panel.is-visible { display: flex; }
    .error-panel h2 {
      font-size: 1.05rem;
      color: var(--danger);
    }
    .error-panel p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: var(--primary);
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .btn:hover { background: #4338ca; transform: translateY(-1px); }
    .btn--ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
    }
    .btn--ghost:hover { background: rgba(255, 255, 255, 0.06); }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.85; }
      50%      { transform: scale(1.05); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-ring::after,
      .loader-ring__core { animation: none; }
      .app-frame, .preloader { transition: none; }
    }
  </style>
</head>

<body>

  <!-- Embedded application -->
  <iframe
    id="appFrame"
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbyrsuX9w2hzEYteellV7zoE4-rkJ8Gc28XzaMlSLe3pr82wKgCEA6JXbTF3-qw22LaV/exec"
    title="Application"
    allow="clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <!-- Pre-loader overlay -->
  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-label="Loading">
    <div class="loader-ring" aria-hidden="true">
      <div class="loader-ring__core"></div>
    </div>

    <div class="brand">Loading</div>

    <div class="progress" aria-hidden="true">
      <div id="progressBar" class="progress__bar"></div>
    </div>
    <div id="progressValue" class="progress__value">0%</div>

    <div id="status" class="status">Connecting to server…</div>

    <div id="errorPanel" class="error-panel" role="alert">
      <h2>Taking longer than expected</h2>
      <p>The application did not respond in time. It may be blocked from embedding, or your connection may be unstable.</p>
      <div class="btn-group">
        <button id="retryBtn" class="btn" type="button">Retry</button>
        <a id="openTabBtn" class="btn btn--ghost" target="_blank" rel="noopener noreferrer">Open in new tab</a>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const CONFIG = {
        url: "https://script.google.com/macros/s/AKfycbyrsuX9w2hzEYteellV7zoE4-rkJ8Gc28XzaMlSLe3pr82wKgCEA6JXbTF3-qw22LaV/exec",
        timeoutMs: 20000,   // give up after 20s
        minDisplayMs: 900,  // keep loader visible at least this long (avoids flicker)
        maxSimulated: 90    // simulated progress cap until real load completes
      };

      const iframe      = document.getElementById("appFrame");
      const preloader   = document.getElementById("preloader");
      const progressBar = document.getElementById("progressBar");
      const progressVal = document.getElementById("progressValue");
      const statusEl    = document.getElementById("status");
      const errorPanel  = document.getElementById("errorPanel");
      const retryBtn    = document.getElementById("retryBtn");
      const openTabBtn  = document.getElementById("openTabBtn");

      const startTime = performance.now();
      let progress = 0;
      let progressTimer = null;
      let timeoutTimer = null;
      let finished = false;

      const statusMessages = [
        { at: 0,  text: "Connecting to server…" },
        { at: 30, text: "Loading resources…" },
        { at: 60, text: "Preparing interface…" },
        { at: 85, text: "Almost there…" }
      ];

      function setProgress(value) {
        progress = Math.min(100, Math.max(0, value));
        progressBar.style.width = progress + "%";
        progressVal.textContent = Math.round(progress) + "%";

        const msg = [...statusMessages].reverse().find(m => progress >= m.at);
        if (msg) statusEl.textContent = msg.text;
      }

      function startProgress() {
        clearInterval(progressTimer);
        progressTimer = setInterval(() => {
          // Ease toward the cap so the bar always appears to move
          const remaining = CONFIG.maxSimulated - progress;
          if (remaining > 0) setProgress(progress + Math.max(0.4, remaining * 0.04));
        }, 180);
      }

      function showError() {
        if (finished) return;
        clearInterval(progressTimer);
        statusEl.textContent = "Unable to load application";
        errorPanel.classList.add("is-visible");
        openTabBtn.href = CONFIG.url;
      }

      function hidePreloader() {
        preloader.classList.add("is-hidden");
        iframe.classList.add("is-visible");
        preloader.addEventListener("transitionend", () => {
          preloader.style.display = "none";
        }, { once: true });
      }

      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutTimer);
        clearInterval(progressTimer);
        setProgress(100);
        statusEl.textContent = "Ready";

        const elapsed = performance.now() - startTime;
        const wait = Math.max(0, CONFIG.minDisplayMs - elapsed);
        setTimeout(hidePreloader, wait + 250);
      }

      function load() {
        finished = false;
        errorPanel.classList.remove("is-visible");
        setProgress(0);
        startProgress();

        clearTimeout(timeoutTimer);
        timeoutTimer = setTimeout(showError, CONFIG.timeoutMs);

        // Reload iframe source (used by Retry)
        iframe.src = CONFIG.url;
      }

      iframe.addEventListener("load", finish);
      retryBtn.addEventListener("click", load);

      // Initial start
      startProgress();
      timeoutTimer = setTimeout(showError, CONFIG.timeoutMs);
    })();
  </script>
</body>
</html>
